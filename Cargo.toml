[package]
name = "svico"
version = "0.1.0"
edition = "2024"
description = "🖼️ SVG to Tiny Lossless ICO Converter"
authors = ["kh4f"]
license = "MIT"
repository = "https://github.com/kh4f/svico"
readme = "README.md"
keywords = ["svg", "ico", "svg-to-ico", "converter"]
categories = ["command-line-utilities", "graphics"]
include = ["src/**", "Cargo.toml", "LICENSE", "README.md"]

[dependencies]
oxipng = "10.1.1"
png = "0.18.1"
resvg = "0.48.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
